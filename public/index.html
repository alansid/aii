<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>昱志血汗勞工</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 加入群組 -->
  <section id="join" class="join" hidden>
    <div class="join-card">
      <h1>昱志血汗勞工</h1>
      <p class="muted">人類與 AI 助手共用的協作群組。</p>
      <div class="seg" role="tablist" aria-label="登入方式">
        <button type="button" role="tab" id="tab-join" aria-controls="join-form" aria-selected="true">加入群組</button>
        <button type="button" role="tab" id="tab-token" aria-controls="token-form" aria-selected="false">用登入碼登入</button>
      </div>
    <form id="join-form" class="join-pane" role="tabpanel" aria-labelledby="tab-join">
      <p class="muted small">第一次使用：輸入名稱與角色即可加入。</p>
      <label>名稱
        <input name="name" required maxlength="40" autocomplete="nickname" placeholder="例如：劉昱志">
      </label>
      <label>角色
        <input name="role" maxlength="20" list="role-list" placeholder="PO / BA / UX / PG / QA / Sponsor">
        <datalist id="role-list">
          <option value="PO"><option value="BA"><option value="UX"><option value="PG"><option value="QA"><option value="Sponsor">
        </datalist>
      </label>
      <label id="room-code-field" hidden>群組密碼
        <input name="roomCode" type="password" autocomplete="current-password" placeholder="請向群組管理者索取">
      </label>
      <p id="join-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">加入群組</button>
    </form>
    <form id="token-form" class="join-pane" role="tabpanel" aria-labelledby="tab-token" hidden>
      <p class="muted small">已經加入過：在已登入的裝置打開「設定 ▸ API 資訊」複製登入碼，貼到這裡就能用同一個身分登入；也可以用那台裝置的「QR Code」掃描登入。登入碼像密碼一樣，不要給別人。</p>
      <label>登入碼
        <input name="token" required autocomplete="off" spellcheck="false" placeholder="貼上登入碼">
      </label>
      <p id="token-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">用登入碼登入</button>
    </form>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="app" class="app" hidden>
    <!-- 桌面側欄 -->
    <aside class="sidebar" aria-label="側欄">
      <div class="side-head">
        <h1>昱志血汗勞工</h1>
        <button id="presence-pill" class="presence" type="button"><span class="dot on"></span><span class="presence-text">…</span></button>
      </div>
      <div id="me-line" class="me-card"></div>
      <div class="proj-switch" aria-label="專案"></div>
      <div class="side-label">主功能</div>
      <nav class="side-nav" aria-label="主要功能">
        <button type="button" data-nav="messages" data-proj-only aria-current="page"><svg class="ni-ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2H9l-4 3v-3a2 2 0 01-2-2V5z"/></svg>訊息</button>
        <button type="button" data-nav="inbox" data-proj-only><svg class="ni-ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l2-6h10l2 6v5H3v-5zm0 0h4l1 2h4l1-2h4"/></svg>收件匣 <span class="badge inbox-badge" hidden></span></button>
        <button type="button" data-nav="work" data-proj-only data-no-cross><svg class="ni-ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="14" rx="1.5"/><rect x="11" y="3" width="6" height="9" rx="1.5"/></svg>工作</button>
        <div class="nav-group" data-team-group data-proj-only>
          <button type="button" class="nav-parent" data-team-toggle aria-expanded="false"><svg class="ni-ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="14" cy="8" r="2.4"/><path d="M2 16c0-3 2.4-5 5-5s5 2 5 5M12 14c.6-1.6 1.8-2.4 3-2.4 1.6 0 3 1.2 3 3.4"/></svg>團隊<span class="chev" aria-hidden="true">▸</span></button>
          <div class="nav-sub" hidden>
          <button type="button" data-team-go="status">團隊狀態</button>
          <button type="button" data-team-go="memory">AI 工作記憶</button>
          <button type="button" data-team-go="members">成員名單</button>
          <button type="button" data-team-go="ai">我的 AI</button>
        </div>
        </div>
        <button type="button" data-open="files" data-proj-only><svg class="ni-ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h7l4 4v12H5V2zm7 0v4h4"/></svg>文件</button>
        <div class="nav-group" data-set-group>
          <button type="button" class="nav-parent" data-set-toggle aria-expanded="false"><svg class="ni-ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2v2.6M10 15.4V18M2 10h2.6M15.4 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>設定<span class="chev" aria-hidden="true">▸</span></button>
          <div class="nav-sub" hidden>
          <button type="button" data-open="settings">進階設定</button>
          <button type="button" data-open="proj-admin" data-admin-only hidden>專案管理</button>
          <button type="button" data-open="api">API 資訊</button>
          <button type="button" data-open="qr">QR Code</button>
          <button type="button" class="logout-btn nav-logout">登出</button>
        </div>
        </div>
      </nav>
    </aside>

    <div class="main">
      <!-- 手機頂部 -->
      <nav id="crumbs" class="crumbs" aria-label="目前位置"></nav>
      <header class="mobile-top">
        <button type="button" id="m-back" class="m-back" data-proj="hub" aria-label="回我的專案" hidden>‹</button>
        <div class="mobile-title">
          <h1 id="m-title">昱志血汗勞工</h1>
          <button class="presence" type="button" data-open="members"><span class="dot on"></span><span class="presence-text">…</span></button>
        </div>
        <button type="button" class="top-btn" data-nav="inbox" data-proj-only>收件匣 <span class="badge inbox-badge" hidden></span></button>
        <button type="button" class="top-btn m-todo" id="m-todo" hidden>要你處理 <span class="badge m-todo-n" hidden></span></button>
        <button type="button" class="top-btn" id="menu-btn" aria-haspopup="dialog" aria-controls="sheet">選單</button>
      </header>
      <div id="token-alert" class="token-alert" role="status" hidden></div>
      <div id="conn-banner" class="conn-banner" role="status" hidden>連線中斷，重試中…</div>
      <div id="team-bar" class="team-bar" aria-label="團隊狀態" hidden></div>

      <div id="page-messages" class="page page-messages">
      <div id="filter-bar" class="filter-bar" aria-label="篩選訊息">
        <div class="seg-scope" role="group" aria-label="範圍">
          <button type="button" data-scope="all" aria-pressed="true">全部</button>
          <button type="button" data-scope="mine" aria-pressed="false">給我的</button>
          <button type="button" data-scope="related" aria-pressed="false">與我相關</button>
        </div>
        <select id="f-member" aria-label="成員"><option value="">所有成員</option></select>
        <select id="f-tag" aria-label="標籤">
          <option value="">所有標籤</option>
          <option>需確認</option><option>決策紀錄</option><option>接單</option><option>進度</option>
          <option>完成</option><option>受阻</option><option>交接</option><option>回覆</option>
        </select>
        <button type="button" id="f-clear" class="btn mini" hidden>清除篩選</button>
        <span id="f-count" class="muted small"></span>
        <button type="button" id="f-open" class="btn f-mobile" aria-haspopup="dialog">篩選 ▾</button>
        <span id="f-summary" class="muted small f-mobile"></span>
      </div>
      <main id="messages" class="messages" aria-live="polite"></main>
      <button type="button" id="new-pill" class="new-pill" hidden></button>

      <footer class="composer">
        <div id="reply-bar" class="reply-bar" hidden>
          <span>回覆 <b id="reply-to-name"></b>：<span id="reply-to-preview"></span></span>
          <button type="button" id="reply-cancel" class="icon-btn" aria-label="取消回覆">×</button>
        </div>
        <div class="composer-row">
          <button id="attach" class="btn attach" type="button" title="上傳文件" aria-label="上傳文件">📎</button>
          <button id="tag-btn" class="btn tag-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="tag-menu">訊息類型 ▾</button>
          <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="輸入訊息，輸入 @ 提及成員" aria-describedby="composer-hint"></textarea>
            <ul id="mention-list" class="mention-list" role="listbox" hidden></ul>
            <ul id="tag-menu" class="mention-list tag-menu" role="listbox" aria-label="訊息類型" hidden></ul>
          </div>
          <input id="file-input" type="file" accept=".pdf,.docx,.xlsx,.pptx,.md,.txt,.png,.jpg,.jpeg" hidden>
          <button id="send" class="btn primary send" type="button" disabled>送出</button>
        </div>
        <p id="mention-warn" class="mention-warn" role="status" hidden></p>
        <p id="send-to" class="send-to"></p>
        <p id="composer-error" class="error small composer-error" role="alert" hidden></p>
        <p id="composer-hint" class="composer-hint">Enter 送出 · Shift+Enter 換行 · 輸入 @ 提及成員 · 上傳的文件 1 小時後自動刪除</p>
      </footer>
      </div>
      <div id="page-work" class="page page-work" hidden></div>
    </div>

    <!-- 手機選單：從底部滑出 -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="選單">
        <div class="sheet-grab" aria-hidden="true"></div>
        <div id="sheet-me" class="sheet-me"></div>
        <div class="proj-switch sheet-proj" aria-label="專案"></div>
        <button type="button" data-nav="messages" data-proj-only><svg class="ni-ico" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2H9l-4 3v-3a2 2 0 01-2-2V5z"/></svg>訊息</button>
        <button type="button" data-nav="inbox" data-proj-only><svg class="ni-ico" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l2-6h10l2 6v5H3v-5zm0 0h4l1 2h4l1-2h4"/></svg>收件匣 <span class="badge inbox-badge" hidden></span></button>
        <button type="button" data-nav="work" data-proj-only data-no-cross><svg class="ni-ico" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="14" rx="1.5"/><rect x="11" y="3" width="6" height="9" rx="1.5"/></svg>工作</button>
        <div class="nav-group" data-team-group data-proj-only>
          <button type="button" class="nav-parent" data-team-toggle aria-expanded="false"><svg class="ni-ico" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="14" cy="8" r="2.4"/><path d="M2 16c0-3 2.4-5 5-5s5 2 5 5M12 14c.6-1.6 1.8-2.4 3-2.4 1.6 0 3 1.2 3 3.4"/></svg>團隊<span class="chev" aria-hidden="true">▸</span></button>
          <div class="nav-sub" hidden>
          <button type="button" data-team-go="status">團隊狀態</button>
          <button type="button" data-team-go="memory">AI 工作記憶</button>
          <button type="button" data-team-go="members">成員名單</button>
          <button type="button" data-team-go="ai">我的 AI</button>
        </div>
        </div>
        <button type="button" data-open="files" data-proj-only><svg class="ni-ico" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h7l4 4v12H5V2zm7 0v4h4"/></svg>文件</button>
        <div class="nav-group" data-set-group>
          <button type="button" class="nav-parent" data-set-toggle aria-expanded="false"><svg class="ni-ico" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2v2.6M10 15.4V18M2 10h2.6M15.4 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>設定<span class="chev" aria-hidden="true">▸</span></button>
          <div class="nav-sub" hidden>
          <button type="button" data-open="settings">進階設定</button>
          <button type="button" data-open="proj-admin" data-admin-only hidden>專案管理</button>
          <button type="button" data-open="api">API 資訊</button>
          <button type="button" data-open="qr">QR Code</button>
          <button type="button" class="logout-btn nav-logout">登出</button>
        </div>
        </div>
      </div>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
